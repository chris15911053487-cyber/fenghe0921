<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>成本执行台 · 登录</title>
<!-- 服务器模式（dev_server.py --server）的登录页：用 B1 账号密码登录，服务端经 Service Layer 验证，权限取 OUSR 自定义字段。 -->
<style>
:root { --bg:#f6f3ee; --card:#fff; --fg:#2b2622; --mute:#7a7068; --line:#e2dbd2; --accent:#a8572c; --err:#b3261e; }
@media (prefers-color-scheme: dark) { :root { --bg:#1c1a18; --card:#262321; --fg:#ece6df; --mute:#a59b91; --line:#3a3532; --accent:#e08a5a; --err:#ff8a80; } }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--fg);
  font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif; padding:16px; }
form { width:100%; max-width:340px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:28px 24px; }
h1 { font-size:18px; margin:0 0 4px; }
p { margin:0 0 18px; color:var(--mute); font-size:13px; }
label { display:block; font-size:13px; margin:12px 0 4px; }
input, select { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); font:inherit; }
input:focus, select:focus { outline:2px solid var(--accent); outline-offset:-1px; }
button { margin-top:20px; width:100%; padding:9px; border:0; border-radius:6px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
button:disabled { opacity:.6; cursor:default; }
.err { color:var(--err); font-size:13px; margin-top:12px; min-height:1em; }
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>成本执行台</h1>
  <p>用 SAP Business One 账号登录</p>
  <div id="coRow" hidden><label for="c">公司（账套）</label><select id="c"></select></div>
  <label for="u">B1 用户代码</label>
  <input id="u" name="username" autocomplete="username" maxlength="50" required>
  <label for="p">密码</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <button id="b" type="submit">登录</button>
  <div class="err" id="e"></div>
</form>
<script>
"use strict";
// 光标：记得上次的用户名就放在密码框，否则放在用户名框（不用 autofocus，免得浏览器提示“Autofocus processing was blocked”）
let lastUser = ""; try { lastUser = localStorage.getItem("cc.loginUser") || ""; } catch (e) {}
if (lastUser) document.getElementById("u").value = lastUser;
document.getElementById(lastUser ? "p" : "u").focus();
// 公司（账套）（用户 2026-10-23）：B1 登录和权限都按所选公司；只有一个公司时不显示。默认选 ?co=、上次登录的、服务端默认
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let COMPANY = "";
(async () => {
  try {
    const j = await (await fetch("/api/companies", {headers:{"X-Requested-With":"cost-console"}})).json();
    if (!j.ok) return;
    const hm = /[?&]co=([^&]+)/.exec(location.hash);   // 打开的是带 co= 的链接时，先选链接里的公司
    let want = new URLSearchParams(location.search).get("co") || (hm ? decodeURIComponent(hm[1]) : ""); try { want = want || localStorage.getItem("cc.loginCo") || ""; } catch (e) {}
    const list = j.companies || [], pick = list.some(c => c.schema === want) ? want : j.default;
    COMPANY = pick;
    if (list.length < 2) return;
    const sel = document.getElementById("c");
    sel.innerHTML = list.map(c => `<option value="${esc(c.schema)}"${c.schema === pick ? " selected" : ""}>${esc(c.schema)}${c.name ? " · " + esc(c.name) : ""}</option>`).join("");
    sel.onchange = () => { COMPANY = sel.value; };
    document.getElementById("coRow").hidden = false;
  } catch (e) {}
})();
document.getElementById("f").onsubmit = async ev => {
  ev.preventDefault();
  const b = document.getElementById("b"), e = document.getElementById("e"), user = document.getElementById("u").value.trim();
  b.disabled = true; b.textContent = "正在验证…"; e.textContent = "";
  try {
    const r = await fetch("/api/login", {method:"POST", headers:{"X-Requested-With":"cost-console", "Content-Type":"application/json"},
      body:JSON.stringify({user, password:document.getElementById("p").value, company:COMPANY})});
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "登录失败");
    try { localStorage.setItem("cc.loginUser", user); if (COMPANY) localStorage.setItem("cc.loginCo", COMPANY); } catch (x) {}
    location.replace("/" + location.hash);   // 带着原来的链接（#页面?run=…）进去
  } catch (x) { e.textContent = x.message; b.disabled = false; b.textContent = "登录"; }
};
</script>
</body>
</html>
